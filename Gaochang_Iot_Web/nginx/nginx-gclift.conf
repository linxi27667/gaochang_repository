# ==============================================================================
# 高昌机电工业物联网管理平台 - Nginx 反向代理配置
# 适用域名: gclift.net, www.gclift.net, mqtt.gclift.net
# 适用服务: Node.js / Express Web 平台 (监听 127.0.0.1:3100)
# ==============================================================================

# 1. HTTP 80 端口服务 (公安与工信审核必须支持 HTTP 正常访问)
server {
    listen 80;
    listen [::]:80;
    server_name gclift.net www.gclift.net mqtt.gclift.net;

    # 客户端上传文件大小限制
    client_max_body_size 50M;

    # 访问日志与错误日志
    access_log /var/log/nginx/gclift_access.log;
    error_log /var/log/nginx/gclift_error.log;

    # Let's Encrypt / ACME 证书校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 反向代理至 IoT 平台前端与 API (端口 3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实客户端 IP 与请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

