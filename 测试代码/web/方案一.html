<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>高昌举升机 - Navy Tech UI 模拟</title>
    <style>
        /* ============================================
         * Navy Tech 调色板 (对应 LVGL 宏定义)
         * ============================================ */
        :root {
            --COLOR_BG_GLOBAL: #181E29;
            --COLOR_BG_CARD: #242B38;
            --COLOR_HIGHLIGHT: #2080FF;
            --COLOR_TEXT_PRIMARY: #FFFFFF;
            --COLOR_TEXT_SECONDARY: #94A3B8;
            --COLOR_BORDER: #3A4556;
            --COLOR_WARNING: #FFB020;
            --COLOR_SUCCESS: #00C853;
            --COLOR_ERROR: #FF5252;
            --COLOR_CARD_HOVER: rgba(32, 128, 255, 0.15);
            --RADIUS_SMALL: 8px;
            --RADIUS_MEDIUM: 16px;
            --RADIUS_LARGE: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F1419 0%, var(--COLOR_BG_GLOBAL) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            width: 1024px;
            height: 600px;
            background: var(--COLOR_BG_GLOBAL);
            position: relative;
            overflow: hidden;
            border-radius: var(--RADIUS_LARGE);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
         * Header - Logo 商业化设计
         * ============================================ */
        .header {
            width: 100%;
            height: 60px;
            background: var(--COLOR_BG_CARD);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: var(--RADIUS_LARGE) var(--RADIUS_LARGE) 0 0;
        }

        /* Logo容器 - 支持图片或图形化Logo */
        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Logo图标区域 */
        .logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-icon svg {
            width: 40px;
            height: 40px;
        }

        /* Logo文字样式 */
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .logo-brand {
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-sub {
            color: #E03030;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .header-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--RADIUS_SMALL);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: var(--COLOR_SUCCESS);
            box-shadow: 0 0 10px var(--COLOR_SUCCESS);
        }
        .status-dot.warning {
            background: var(--COLOR_WARNING);
            box-shadow: 0 0 10px var(--COLOR_WARNING);
        }
        .status-dot.error {
            background: var(--COLOR_ERROR);
            box-shadow: 0 0 10px var(--COLOR_ERROR);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-text {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 13px;
        }

        .time-display {
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 16px;
            font-weight: 500;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--RADIUS_SMALL);
        }

        /* ============================================
         * TabBar - 精致紧凑设计
         * ============================================ */
        .tabbar {
            width: 100%;
            height: 80px;
            background: #1A2332;
            display: flex;
            padding: 8px 16px;
            gap: 8px;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 0 0 var(--RADIUS_LARGE) var(--RADIUS_LARGE);
        }

        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--COLOR_TEXT_SECONDARY);
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            border-radius: var(--RADIUS_MEDIUM);
            font-size: 14px;
            padding: 8px 4px;
        }

        .tab-btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: var(--RADIUS_SMALL);
            transition: all 0.25s ease;
        }

        .tab-btn-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: var(--COLOR_HIGHLIGHT);
            color: var(--COLOR_TEXT_PRIMARY);
        }

        .tab-btn.active .tab-btn-icon svg {
            stroke: var(--COLOR_TEXT_PRIMARY);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(32, 128, 255, 0.1);
            color: var(--COLOR_TEXT_PRIMARY);
        }

        /* ============================================
         * Content Area
         * ============================================ */
        .content-area {
            width: 100%;
            height: 460px;
            position: absolute;
            top: 60px;
            left: 0;
            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            padding: 16px;
            gap: 16px;
            /* 初始不可见，避免动画残留 */
            visibility: hidden;
        }

        .page.visible {
            visibility: visible;
        }

        /* ============================================
         * 数据面板卡片
         * ============================================ */
        .panel-card {
            background: var(--COLOR_BG_CARD);
            border-radius: var(--RADIUS_LARGE);
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .panel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .panel-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 14px;
            font-weight: 500;
        }

        .card-badge {
            padding: 4px 10px;
            border-radius: var(--RADIUS_SMALL);
            font-size: 12px;
            font-weight: 500;
        }

        .card-badge.normal { background: rgba(0, 200, 83, 0.2); color: var(--COLOR_SUCCESS); }
        .card-badge.warning { background: rgba(255, 176, 32, 0.2); color: var(--COLOR_WARNING); }
        .card-badge.error { background: rgba(255, 82, 82, 0.2); color: var(--COLOR_ERROR); }

        .card-value {
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 32px;
            font-weight: 700;
        }

        .card-unit {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 13px;
            margin-top: 2px;
        }

        /* ============================================
         * 数据看板布局 - 修正重合问题
         * ============================================ */
        .data-panel {
            flex-direction: column;
            gap: 16px;
        }

        /* 高度数值行 - 三等分布局 */
        .height-row {
            display: flex;
            gap: 16px;
            flex: 0 0 100px;
        }

        /* 高度卡片 - 均分宽度 */
        .height-card {
            flex: 1;
        }

        /* 高度差卡片 - 均分宽度 */
        .diff-card {
            flex: 1;
        }

        /* 状态信息卡片 - 填满剩余高度，支持滚动 */
        .status-card {
            flex: 1;
            overflow-y: auto;
        }

        /* 自定义滚动条样式 */
        .status-card::-webkit-scrollbar {
            width: 6px;
        }

        .status-card::-webkit-scrollbar-track {
            background: var(--COLOR_BG_GLOBAL);
            border-radius: 3px;
        }

        .status-card::-webkit-scrollbar-thumb {
            background: var(--COLOR_HIGHLIGHT);
            border-radius: 3px;
        }

        /* 高度差显示 */
        .diff-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 0;
        }

        .diff-value {
            font-size: 28px;
            font-weight: 700;
        }
        .diff-value.normal { color: var(--COLOR_SUCCESS); }
        .diff-value.warning { color: var(--COLOR_WARNING); }
        .diff-value.error { color: var(--COLOR_ERROR); }

        .diff-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--RADIUS_MEDIUM);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .diff-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke-width: 2;
        }

        .diff-icon.normal { background: rgba(0, 200, 83, 0.15); }
        .diff-icon.normal svg { stroke: var(--COLOR_SUCCESS); }
        .diff-icon.warning { background: rgba(255, 176, 32, 0.15); }
        .diff-icon.warning svg { stroke: var(--COLOR_WARNING); }
        .diff-icon.error { background: rgba(255, 82, 82, 0.15); }
        .diff-icon.error svg { stroke: var(--COLOR_ERROR); }

        /* 状态列表 */
        .status-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--RADIUS_SMALL);
            flex: 1;
        }

        .status-item-label {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 14px;
        }

        .status-item-value {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-item-value svg {
            width: 16px;
            height: 14px;
            fill: none;
            stroke-width: 2;
        }

        /* ============================================
         * 控制面板按钮 - 大尺寸设计
         * ============================================ */
        .control-panel {
            flex-flow: row wrap;
            align-content: center;
            justify-content: center;
            padding: 12px 16px;
        }

        .control-btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .app-btn {
            width: 220px;
            height: 140px;
            background: var(--COLOR_BG_CARD);
            border-radius: var(--RADIUS_LARGE);
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .app-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        }

        .app-btn-icon {
            width: 64px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: var(--RADIUS_MEDIUM);
            background: linear-gradient(135deg, rgba(32, 128, 255, 0.2), rgba(32, 128, 255, 0.08));
            transition: all 0.3s ease;
        }

        .app-btn-icon svg {
            width: 36px;
            height: 36px;
            stroke: var(--COLOR_HIGHLIGHT);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .app-btn:hover {
            box-shadow: 0 8px 30px rgba(32, 128, 255, 0.3);
            transform: translateY(-4px);
        }

        .app-btn:hover .app-btn-icon {
            background: var(--COLOR_HIGHLIGHT);
        }

        .app-btn:hover .app-btn-icon svg {
            stroke: var(--COLOR_TEXT_PRIMARY);
        }

        .app-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .app-btn-text {
            font-size: 16px;
            color: var(--COLOR_TEXT_SECONDARY);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .app-btn:hover .app-btn-text {
            color: var(--COLOR_TEXT_PRIMARY);
        }

        /* ============================================
         * 设置面板
         * ============================================ */
        .settings-panel {
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            overflow-y: auto;
        }

        .settings-panel::-webkit-scrollbar {
            width: 6px;
        }

        .settings-panel::-webkit-scrollbar-track {
            background: var(--COLOR_BG_GLOBAL);
            border-radius: 3px;
        }

        .settings-panel::-webkit-scrollbar-thumb {
            background: var(--COLOR_HIGHLIGHT);
            border-radius: 3px;
        }

        .settings-item {
            background: var(--COLOR_BG_CARD);
            border-radius: var(--RADIUS_LARGE);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .settings-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .settings-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--RADIUS_SMALL);
            background: rgba(32, 128, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .settings-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--COLOR_HIGHLIGHT);
            fill: none;
            stroke-width: 2;
        }

        .settings-label {
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 15px;
            font-weight: 500;
        }

        .settings-value {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 14px;
        }

        /* Slider 容器和样式 - 醒目设计 */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 240px;
        }

        .slider-container {
            flex: 1;
            height: 28px;
            display: flex;
            align-items: center;
            background: var(--COLOR_BG_GLOBAL);
            border-radius: var(--RADIUS_MEDIUM);
            padding: 0 10px;
        }

        .slider {
            width: 100%;
            height: 8px;
            background: linear-gradient(to right, var(--COLOR_HIGHLIGHT) 0%, var(--COLOR_HIGHLIGHT) var(--slider-progress, 80%), rgba(255,255,255,0.1) var(--slider-progress, 80%), rgba(255,255,255,0.1) 100%);
            border-radius: var(--RADIUS_SMALL);
            appearance: none;
            cursor: pointer;
            outline: none;
            position: relative;
        }

        /* Slider 滑块样式 - 更醒目 */
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            background: var(--COLOR_TEXT_PRIMARY);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 0 4px rgba(32, 128, 255, 0.3);
            border: 3px solid var(--COLOR_HIGHLIGHT);
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            box-shadow: 0 4px 12px rgba(32, 128, 255, 0.5), 0 0 0 6px rgba(32, 128, 255, 0.4);
            transform: scale(1.1);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: var(--COLOR_TEXT_PRIMARY);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 3px solid var(--COLOR_HIGHLIGHT);
        }

        .slider::-ms-thumb {
            width: 24px;
            height: 24px;
            background: var(--COLOR_TEXT_PRIMARY);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid var(--COLOR_HIGHLIGHT);
        }

        .slider::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: var(--RADIUS_SMALL);
        }

        .slider::-moz-range-track {
            height: 8px;
            background: var(--COLOR_BG_GLOBAL);
            border-radius: var(--RADIUS_SMALL);
        }

        .slider::-moz-range-progress {
            height: 8px;
            background: var(--COLOR_HIGHLIGHT);
            border-radius: var(--RADIUS_SMALL);
        }

        .slider-value {
            color: var(--COLOR_HIGHLIGHT);
            font-size: 16px;
            font-weight: 700;
            min-width: 44px;
            text-align: right;
            padding: 6px 10px;
            background: rgba(32, 128, 255, 0.15);
            border-radius: var(--RADIUS_SMALL);
        }

        .dropdown {
            background: var(--COLOR_BG_GLOBAL);
            border: 1px solid var(--COLOR_BORDER);
            border-radius: var(--RADIUS_SMALL);
            padding: 10px 16px;
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 14px;
            cursor: pointer;
            outline: none;
            min-width: 120px;
        }

        .dropdown:focus {
            border-color: var(--COLOR_HIGHLIGHT);
        }

        /* 设置页面按钮样式 */
        .settings-btn {
            padding: 10px 24px;
            background: var(--COLOR_HIGHLIGHT);
            color: var(--COLOR_TEXT_PRIMARY);
            border: none;
            border-radius: var(--RADIUS_MEDIUM);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(32, 128, 255, 0.3);
        }

        .settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(32, 128, 255, 0.4);
        }

        /* ============================================
         * 上电启动登录全屏覆盖
         * ============================================ */
        .boot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--COLOR_BG_GLOBAL);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            border-radius: var(--RADIUS_LARGE);
        }

        .boot-overlay.show {
            display: flex;
        }

        .boot-card {
            width: 400px;
            background: var(--COLOR_BG_CARD);
            border-radius: var(--RADIUS_LARGE);
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: loginEnter 0.4s ease;
            text-align: center;
        }

        .boot-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
        }

        .boot-logo svg {
            width: 80px;
            height: 80px;
        }

        .boot-title {
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 22px;
            font-weight: 700;
        }

        .boot-subtitle {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 14px;
            margin-top: -8px;
        }

        /* ============================================
         * 登录弹窗
         * ============================================ */
        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 150;
            border-radius: var(--RADIUS_LARGE);
        }

        .login-overlay.show {
            display: flex;
        }

        .login-dialog {
            width: 380px;
            background: var(--COLOR_BG_CARD);
            border-radius: var(--RADIUS_LARGE);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: loginEnter 0.3s ease;
        }

        @keyframes loginEnter {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .login-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .login-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--RADIUS_MEDIUM);
            background: rgba(32, 128, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--COLOR_HIGHLIGHT);
            fill: none;
            stroke-width: 2;
        }

        .login-title {
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 18px;
            font-weight: 600;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .login-label {
            color: var(--COLOR_TEXT_SECONDARY);
            font-size: 13px;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--COLOR_BG_GLOBAL);
            border: 1px solid var(--COLOR_BORDER);
            border-radius: var(--RADIUS_SMALL);
            color: var(--COLOR_TEXT_PRIMARY);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .login-input:focus {
            border-color: var(--COLOR_HIGHLIGHT);
        }

        .login-error {
            color: var(--COLOR_ERROR);
            font-size: 12px;

        /* ============================================
         * 动画引擎 - 修正残留问题
         * ============================================ */
        function ui_switch_tab_anim(content_area, create_page_func) {
            if (is_animating) return;
            is_animating = true;

            const old_page = current_page;
            const new_page = create_page_func(content_area);

            // 新页面初始在屏幕右侧
            new_page.style.transform = 'translateX(1024px)';
            new_page.style.opacity = '0';
            new_page.style.zIndex = '10';
            new_page.classList.add('page-entering', 'visible');

            // 旧页面淡出并隐藏
            if (old_page) {
                old_page.style.zIndex = '1';
                old_page.style.transition = 'opacity 0.2s ease';
                old_page.style.opacity = '0';
            }

            current_page = new_page;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    new_page.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s ease';
                    new_page.style.transform = 'translateX(0)';
                    new_page.style.opacity = '1';
                });
            });

            setTimeout(() => {
                if (old_page && old_page.parentNode) {
                    old_page.parentNode.removeChild(old_page);
                }
                if (new_page) {
                    new_page.style.zIndex = '';
                    new_page.style.transition = '';
                }
                is_animating = false;
            }, 400);
        }

        /* ============================================
         * Tab 切换
         * ============================================ */
        function ui_switch_tab(tab_name) {
            if (tab_name === current_tab || is_animating) return;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab_name);
            });

            current_tab = tab_name;
            const content_area = document.getElementById('content_area');

            switch (tab_name) {
                case 'data':
                    ui_switch_tab_anim(content_area, ui_data_panel_create);
                    break;
                case 'control':
                    ui_switch_tab_anim(content_area, ui_control_panel_create);
                    break;
                case 'settings':
                    ui_switch_tab_anim(content_area, ui_settings_panel_create);
                    break;
            }
        }

        /* ============================================
         * 数据看板 - 修正布局
         * ============================================ */
        function ui_data_panel_create(parent) {
            const page = document.createElement('div');
            page.className = 'page data-panel';

            const height_row = document.createElement('div');
            height_row.className = 'height-row';

            const h1_card = create_height_card(t('pillar1'), sim_data.H1, 'mm', sim_data.pillar1_percent);
            const h2_card = create_height_card(t('pillar2'), sim_data.H2, 'mm', sim_data.pillar2_percent);
            const diff_card = create_diff_card(sim_data.height_diff);

            height_row.appendChild(h1_card);
            height_row.appendChild(h2_card);
            height_row.appendChild(diff_card);
            page.appendChild(height_row);

            const status_card = create_status_info_card();
            page.appendChild(status_card);

            parent.appendChild(page);
            return page;
        }

        function create_height_card(title, value, unit, percent) {
            const card = document.createElement('div');
            card.className = 'panel-card height-card';
            const status = get_status_from_percent(percent);
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${title}</span>
                    <span class="card-badge ${status}">${get_status_text(status)}</span>
                </div>
                <div class="card-value">${value}</div>
                <div class="card-unit">${unit}</div>
            `;
            return card;
        }

        function create_diff_card(diff) {
            const card = document.createElement('div');
            card.className = 'panel-card diff-card';
            const status = get_diff_status(diff);
            const badge_text = diff <= 10 ? t('status_reach') : t('status_need_level');
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${t('height_diff')}</span>
                    <span class="card-badge ${status}">${badge_text}</span>
                </div>
                <div class="diff-display">
                    <div class="diff-icon ${status}">
                        ${status === 'normal' ?
                            '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' :
                            '<svg viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>'
                        }
                    </div>
                    <div class="diff-value ${status}">${diff}</div>
                    <div class="card-unit">mm</div>
                </div>
            `;
            return card;
        }

        function create_status_info_card() {
            const card = document.createElement('div');
            card.className = 'panel-card status-card';
            const system_color = sim_data.system_status === 'normal' ? 'var(--COLOR_SUCCESS)' : 'var(--COLOR_ERROR)';
            const link_color = sim_data.link_status === 'linked' ? 'var(--COLOR_SUCCESS)' : 'var(--COLOR_WARNING)';
            const system_icon = sim_data.system_status === 'normal' ?
                '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg>' :
                '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6m0-6l6 6"/></svg>';
            const link_icon = sim_data.link_status === 'linked' ?
                '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0"/><circle cx="12" cy="12" r="3"/></svg>' :
                '<svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 11-12.73 0"/><line x1="12" y2="2" x1="12" y2="12"/></svg>';
            const error_display = sim_data.error_code === 0 ?
                `<span style="color: var(--COLOR_SUCCESS)">${t('status_no_error')}</span>` :
                `<span style="color: var(--COLOR_ERROR)" class="blink-warning">E${sim_data.error_code}</span>`;
            card.innerHTML = `
                <div class="status-list">
                    <div class="status-item">
                        <span class="status-item-label">${t('status_system')}</span>
                        <span class="status-item-value" style="color: ${system_color}">
                            ${system_icon}
                            ${sim_data.system_status === 'normal' ? t('status_normal') : t('status_error')}
                        </span>
                    </div>
                    <div class="status-item">
                        <span class="status-item-label">${t('status_link')}</span>
                        <span class="status-item-value" style="color: ${link_color}">
                            ${link_icon}
                            ${sim_data.link_status === 'linked' ? t('status_linked') : t('status_unlinked')}
                        </span>
                    </div>
                    <div class="status-item">
                        <span class="status-item-label">${t('status_error_code')}</span>
                        <span class="status-item-value">${error_display}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-item-label">${t('status_run_mode')}</span>
                        <span class="status-item-value" style="color: var(--COLOR_HIGHLIGHT)">${sim_data.run_mode}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-item-label">${t('status_work_count')}</span>
                        <span class="status-item-value" style="color: var(--COLOR_TEXT_PRIMARY)">${sim_data.work_count} ${t('status_times')}</span>
                    </div>
                </div>
            `;
            return card;
        }

        /* ============================================
         * 控制面板
         * ============================================ */
        function ui_control_panel_create(parent) {
            const page = document.createElement('div');
            page.className = 'page control-panel';
            const btn_grid = document.createElement('div');
            btn_grid.className = 'control-btn-grid';

            const buttons = [
                { icon: '<svg viewBox="0 0 24 24"><path d="M3 12h4m3 0h4m3 0h4"/><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>', text: t('ctrl_min_clear'), action: 'min_clear' },
                { icon: '<svg viewBox="0 0 24 24"><path d="M12 19V5m-7 7l7-7 7 7"/></svg>', text: t('ctrl_max_height'), action: 'max_height' },
                { icon: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>', text: t('ctrl_id_set'), action: 'id_set' },
                { icon: '<svg viewBox="0 0 24 24"><path d="M4 15h16M4 15l4-4m-4 4l4 4m8-8l4 4m-4-4l4-4"/></svg>', text: t('ctrl_start_height'), action: 'start_height' },
                { icon: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4"/></svg>', text: t('ctrl_link_set'), action: 'link_set' },
                { icon: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg>', text: t('ctrl_auto_level'), action: 'auto_level', need_confirm: true }
            ];

            buttons.forEach(btn_config => {
                const btn = create_app_icon_btn(btn_config.icon, btn_config.text, btn_config.action, btn_config.need_confirm);
                btn_grid.appendChild(btn);
            });

            page.appendChild(btn_grid);
            parent.appendChild(page);
            return page;
        }

        /* ============================================
         * 设置面板 - 修正Slider显示
         * ============================================ */
        function ui_settings_panel_create(parent) {
            const page = document.createElement('div');
            page.className = 'page settings-panel';

            const settings = [
                {
                    icon: '<svg viewBox="0 0 24 24"><path d="M5 8l6 6m0 0l6-6m-6 6V4"/><path d="M3 21h18"/></svg>',
                    label: t('settings_language'),
                    control_type: 'dropdown'
                },
                {
                    icon: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>',
                    label: t('settings_version'),
                    control_type: 'text',
                    value: 'V1.2.0'
                },
                {
                    icon: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>',
                    label: t('settings_serial'),
                    control_type: 'text',
                    value: 'GC-2024-00128'
                },
                {
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>',
                    label: t('settings_mac'),
                    control_type: 'text',
                    value: 'A1:B2:C3:D4:E5:F6'
                },
                {
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
                    label: t('settings_admin_login'),
                    control_type: 'button',
                    action: 'admin_login'
                },
                {
                    icon: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6m3-3h-6"/></svg>',
                    label: t('settings_add_admin'),
                    control_type: 'button',
                    action: 'add_admin',
                    need_login: true
                }
            ];

            settings.forEach((item, index) => {
                const setting = document.createElement('div');
                setting.className = 'settings-item';

                let control_html = '';
                if (item.control_type === 'dropdown') {
                    control_html = `<select class="dropdown" onchange="handle_language_change(this.value)"><option value="zh" ${current_language === 'zh' ? 'selected' : ''}>${t('lang_zh')}</option><option value="en" ${current_language === 'en' ? 'selected' : ''}>${t('lang_en')}</option></select>`;
                } else if (item.control_type === 'text') {
                    control_html = `<span class="settings-value">${item.value}</span>`;
                } else if (item.control_type === 'button') {
                    const btn_text = item.action === 'admin_login' ? t('btn_login') : t('btn_add');
                    control_html = `<button class="settings-btn" onclick="handle_settings_action('${item.action}', ${item.need_login || false})">${btn_text}</button>`;
                }

                setting.innerHTML = `
                    <div class="settings-left">
                        <div class="settings-icon">${item.icon}</div>
                        <span class="settings-label">${item.label}</span>
                    </div>
                    <div>${control_html}</div>
                `;
                page.appendChild(setting);
            });

            parent.appendChild(page);
            return page;
        }

        // 处理设置页面按钮操作
        let is_admin_logged_in = false;

        function handle_settings_action(action, need_login) {
            if (action === 'admin_login') {
                show_login_dialog();
            } else if (action === 'add_admin') {
                if (!is_admin_logged_in) {
                    show_login_dialog('add_admin');
                } else {
                    show_add_admin_dialog();
                }
            }
        }

        // 登录弹窗相关函数
        let login_after_action = null;

        function show_login_dialog(after_action = null) {
            login_after_action = after_action;
            document.getElementById('login_title').textContent = t('login_title');
            document.getElementById('login_username_label').textContent = t('login_username');
            document.getElementById('login_password_label').textContent = t('login_password');
            document.getElementById('login_username').placeholder = t('login_username_placeholder');
            document.getElementById('login_password').placeholder = t('login_password_placeholder');
            document.getElementById('login_error').textContent = t('login_error');
            document.getElementById('login_error').classList.remove('show');
            document.getElementById('login_confirm_btn').textContent = t('btn_login');
            document.getElementById('login_cancel_btn').textContent = t('login_btn_cancel');
            document.getElementById('login_username').value = '';
            document.getElementById('login_password').value = '';
            document.getElementById('login_overlay').classList.add('show');
        }

        function close_login_dialog() {
            document.getElementById('login_overlay').classList.remove('show');
            login_after_action = null;
        }

        function handle_login() {
            const username = document.getElementById('login_username').value;
            const password = document.getElementById('login_password').value;

            // 模拟验证 (实际项目中应调用后台API)
            if (login_after_action === 'create_admin' && username && password) {
                // 添加新管理员
                console.log(`添加新管理员: ${username}`);
                close_login_dialog();
            } else if (username === 'admin' && password === '123456') {
                is_admin_logged_in = true;
                close_login_dialog();
                console.log('管理员登录成功');

                if (login_after_action === 'add_admin') {
                    show_add_admin_dialog();
                }
            } else {
                document.getElementById('login_error').classList.add('show');
            }
        }

        function show_add_admin_dialog() {
            document.getElementById('login_title').textContent = t('login_add_title');
            document.getElementById('login_username_label').textContent = t('login_username');
            document.getElementById('login_password_label').textContent = t('login_password');
            document.getElementById('login_username').placeholder = t('login_username_placeholder');
            document.getElementById('login_password').placeholder = t('login_password_placeholder');
            document.getElementById('login_error').textContent = t('login_error');
            document.getElementById('login_error').classList.remove('show');
            document.getElementById('login_confirm_btn').textContent = t('btn_add');
            document.getElementById('login_cancel_btn').textContent = t('login_btn_cancel');
            document.getElementById('login_username').value = '';
            document.getElementById('login_password').value = '';
            document.getElementById('login_overlay').classList.add('show');
            login_after_action = 'create_admin';
        }

        function handle_language_change(lang) {
            current_language = lang;
            ui_apply_language();
            // 刷新当前页面内容
            if (current_tab === 'data') {
                ui_switch_tab_anim(document.getElementById('content_area'), ui_data_panel_create);
            } else if (current_tab === 'control') {
                ui_switch_tab_anim(document.getElementById('content_area'), ui_control_panel_create);
            } else if (current_tab === 'settings') {
                ui_switch_tab_anim(document.getElementById('content_area'), ui_settings_panel_create);
            }
        }

        function ui_apply_language() {
            // Logo
            document.getElementById('logo-brand').textContent = t('logo_brand');
            document.getElementById('logo-sub').textContent = t('logo_sub');

            // Tabs
            document.getElementById('tab_data_text').textContent = t('tab_data');
            document.getElementById('tab_control_text').textContent = t('tab_control');
            document.getElementById('tab_settings_text').textContent = t('tab_settings');

            // Header status
            document.getElementById('header_status_text').textContent = sim_data.system_status === 'normal' ? t('header_system_normal') : t('status_error');
            document.getElementById('header_link_text').textContent = sim_data.link_status === 'linked' ? t('header_linked') : t('status_unlinked');

            // Boot screen
            document.getElementById('boot_title').textContent = t('boot_title');
            document.getElementById('boot_subtitle').textContent = t('boot_subtitle');
            document.getElementById('boot_user_label').textContent = t('login_username');
            document.getElementById('boot_pass_label').textContent = t('login_password');
            document.getElementById('boot_username').placeholder = t('login_username_placeholder');
            document.getElementById('boot_password').placeholder = t('login_password_placeholder');
            document.getElementById('boot_login_btn').textContent = t('login_btn_confirm');
            document.getElementById('boot_error').textContent = t('login_error');

            // html lang
            document.documentElement.lang = current_language === 'zh' ? 'zh-CN' : 'en';
        }

        function update_brightness(value) {
            document.getElementById('brightness_value').textContent = value + '%';
            sim_data.brightness = parseInt(value);
            // 更新滑块进度样式
            const slider = document.getElementById('brightness_slider');
            if (slider) {
                slider.style.setProperty('--slider-progress', value + '%');
            }
        }

        function create_app_icon_btn(icon, text, action, need_confirm = false) {
            const btn = document.createElement('button');
            btn.className = 'app-btn';
            btn.innerHTML = `
                <div class="app-btn-icon">${icon}</div>
                <div class="app-btn-text">${text}</div>
            `;
            btn.onclick = function() {
                if (need_confirm) {
                    msgbox_show(`是否执行【${text}】操作？`, action);
                } else {
                    console.log(`执行: ${action}`);
                }
            };
            return btn;
        }

        function get_status_from_percent(percent) {
            if (percent >= 90) return 'error';
            if (percent >= 80) return 'warning';
            return 'normal';
        }

        function get_diff_status(diff) {
            if (diff <= 10) return 'normal';
            if (diff <= 20) return 'warning';
            return 'error';
        }

        function get_status_text(status) {
            const map = { normal: 'status_ok', warning: 'status_high', error: 'status_over' };
            return t(map[status] || 'status_ok');
        }

        /* ============================================
         * Msgbox
         * ============================================ */
        let msgbox_callback = null;

        function msgbox_show(text, action) {
            document.getElementById('msgbox_title').textContent = t('msgbox_title');
            document.getElementById('msgbox_text').textContent = text;
            document.getElementById('msgbox_cancel_btn').textContent = t('msgbox_cancel');
            document.getElementById('msgbox_confirm_btn').textContent = t('msgbox_confirm');
            document.getElementById('msgbox_overlay').classList.add('show');
            msgbox_callback = action;
        }

        function msgbox_close() {
            document.getElementById('msgbox_overlay').classList.remove('show');
            msgbox_callback = null;
        }

        function msgbox_confirm() {
            console.log(`Confirm: ${msgbox_callback}`);
            msgbox_close();
        }

        /* ============================================
         * 时钟与数据更新
         * ============================================ */
        function update_time() {
            const now = new Date();
            document.getElementById('header-time').textContent =
                `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        }

        function update_sim_data() {
            sim_data.H1 = 1800 + Math.floor(Math.random() * 100);
            sim_data.H2 = 1800 + Math.floor(Math.random() * 100);
            sim_data.height_diff = Math.abs(sim_data.H1 - sim_data.H2);
            sim_data.pillar1_percent = 60 + Math.floor(Math.random() * 35);
            sim_data.pillar2_percent = 60 + Math.floor(Math.random() * 35);

            if (Math.random() < 0.05) {
                sim_data.error_code = Math.floor(Math.random() * 100) + 1;
                sim_data.system_status = 'error';
            } else {
                sim_data.error_code = 0;
                sim_data.system_status = 'normal';
            }

            const system_dot = document.getElementById('system_dot');
            if (system_dot) {
                system_dot.className = `status-dot ${sim_data.system_status === 'normal' ? 'online' : 'error'}`;
            }
        }

        /* ============================================
         * 上电启动登录
         * ============================================ */
        function handle_boot_login() {
            const username = document.getElementById('boot_username').value;
            const password = document.getElementById('boot_password').value;

            if (username === 'admin' && password === '123456') {
                is_boot_logged_in = true;
                document.getElementById('boot_overlay').classList.remove('show');
                ui_apply_language();
                ui_init();
            } else {
                document.getElementById('boot_error').textContent = t('login_error');
                document.getElementById('boot_error').classList.add('show');
            }
        }

        /* ============================================
         * 初始化
         * ============================================ */
        function ui_init() {
            const content_area = document.getElementById('content_area');
            current_page = ui_data_panel_create(content_area);
            current_page.classList.add('visible');

            update_time();
            setInterval(update_time, 1000);
            setInterval(update_sim_data, 3000);
        }

        // 上电显示登录界面
        window.onload = function() {
            document.getElementById('boot_overlay').classList.add('show');
        };
    </script>
</body>
</html>
